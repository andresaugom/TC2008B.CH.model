[project]
name = "electoral"
version = "0.1.0"
description = "Mesa model of a single INE polling station (TC2008B challenge)"
requires-python = ">=3.12"
dependencies = ["mesa>=3.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["electoral"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["proceso_electoral-1.py"]   # teacher's reference script, kept untouched

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
